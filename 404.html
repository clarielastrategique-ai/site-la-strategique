<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada | La Stratégique</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--noir:#0B0B0B;--bone:#F4F2EE;--blue:#004AAD;--blue-lift:#5B95F2;--smoke:#63605B}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--noir);color:var(--bone);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:520px;text-align:left}
.k{font-family:'Jost','Futura','Century Gothic',sans-serif;font-size:clamp(64px,18vw,120px);font-weight:500;line-height:1;margin:0 0 16px;color:var(--blue-lift)}
h1{font-family:'Jost','Futura','Century Gothic',sans-serif;font-weight:500;font-size:clamp(24px,5vw,32px);margin:0 0 12px}
p{color:#B5B5B5;line-height:1.6;margin:0 0 28px}
a.b{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:14px 22px;border-radius:999px;font-weight:500}
a.b:hover{background:#0058cc}
small{display:block;margin-top:40px;color:#8A8A8A;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
</style>
</head>
<body>
<main>
<p class="k">404</p>
<h1>Esta página não existe.</h1>
<p>O endereço pode ter mudado ou foi digitado com algum erro. Volte para o início e continue de lá.</p>
<a class="b" id="inicio" href="/">Voltar ao início</a>
<small>La Stratégique</small>
</main>
<script>
(function(){var p=location.pathname.split('/')[1];if(/github\.io$/.test(location.hostname)&&p){document.getElementById('inicio').href='/'+p+'/';}})();
</script>
</body>
</html>
